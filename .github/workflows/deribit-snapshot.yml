name: deribit-hourly-snapshot
on:
  schedule:
    - cron: '7,27,47 * * * *'   # every 20 min; GitHub often delays/skips, trades are backfilled
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: deribit-snapshot, cancel-in-progress: false }
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python deribit_recorder/snapshot.py
      - name: commit
        run: |
          git config user.name "helios-recorder"
          git config user.email "helios-recorder@users.noreply.github.com"
          git add data/deribit
          git commit -m "deribit snapshot $(date -u +%Y-%m-%dT%H:00Z)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
