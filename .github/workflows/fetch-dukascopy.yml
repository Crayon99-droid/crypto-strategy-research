name: fetch-dukascopy
on:
  push:
    branches: [data-fetch-ustec]
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - run: python tools/fetch_dukascopy.py
      - uses: actions/upload-artifact@v4
        with: {name: dukascopy-1m, path: out/, retention-days: 30}
